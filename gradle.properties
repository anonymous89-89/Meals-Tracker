# Project-wide Gradle settings.

# JVM memory — Hilt + Room kapt + Compose together need at least 2 GB
# Without this, the Gradle daemon crashes with GC thrashing on the first build
org.gradle.jvmargs=-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable Gradle parallel builds
org.gradle.parallel=true

# Enable configuration cache for faster subsequent builds
org.gradle.configuration-cache=true

# Enable caching
org.gradle.caching=true

# Kotlin code style for IntelliJ / Android Studio
kotlin.code.style=official

# Enable AndroidX (required — disabling this breaks all AndroidX imports)
android.useAndroidX=true

# Jetpack Compose compiler metrics (optional — disable in CI for speed)
# android.enableComposeCompilerMetrics=true
